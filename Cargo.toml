members = [
    "peko-rs/auth",
    "peko-rs/chat-log",
    "peko-rs/core",
    "peko-rs/cron",
    "peko-rs/engine",
    "peko-rs/events",
    "peko-rs/extension-api",
    "peko-rs/extension-host",
    "peko-rs/fs-persistence",
    "peko-rs/identity",
    "peko-rs/message",
    "peko-rs/observability",
    "peko-rs/peko-daemon",
    "peko-rs/principal",
    "peko-rs/protocol",
    "peko-rs/provider-api",
    "peko-rs/providers",
    "peko-rs/quota",
    "peko-rs/session",
    "peko-rs/subject",
    "peko-rs/tools-builtin",
    "peko-rs/tools-core",
