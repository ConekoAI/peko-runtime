# ---------------------------------------------------------------------------
# Cargo-shear intent block (Phase 0 of the post-migration cleanup).
#
# When `cargo-shear` is installed, it will use this block to surface any
# workspace-crate dep that has no remaining consumer in the crate where
# it is declared. During the 18-phase cleanup, dead deps are expected to
# appear as we migrate root-only domains into workspace peko-rs crates; Phase 0
# only documents the intent, it does NOT install `cargo-shear` in CI yet
# (lint policy was explicitly deferred per the plan).
#
# To run locally once installed:
#   cargo install cargo-shear --locked
#   cargo shear --workspace
#
# Expected dead deps to surface over the cleanup:
#   - peko-protocol in peko-rs/core (after Phase 12 lifts tunnel/ipc)
#   - peko-subject in peko-rs/core  (after Phase 15 deletes src/subject.rs)
#   - peko-quota in peko-rs/core    (after Phase 15 deletes src/quota/)
#   - peko-message in peko-rs/core  (after Phase 15 deletes common/types/message.rs)
#   - peko-tools-core in peko-rs/core (after Phase 15 deletes src/tools/core/)
#   - peko-extension-host in peko-rs/core (after Phase 16 deletes *_compat.rs impls)
#   - peko-engine in peko-rs/core   (after Phase 17 moves agentic_loop tests)
#
# Phase 0.Z-D note: root Cargo.toml is workspace-only. The `peko` package
# (lib `peko_core` + `peko` bin) lives in `peko-rs/core/Cargo.toml`.
# ---------------------------------------------------------------------------
[workspace.metadata.cargo-shear]