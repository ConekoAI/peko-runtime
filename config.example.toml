# Peko configuration reference
#
# Peko keeps very little in config files. Before editing anything by hand,
# know where state actually lives:
#
#   models + API keys ..... `peko model add --api-format <fmt> --base-url <url>
#                           --model <wire-id> --key <key>` — catalog in ~/.peko/models.toml,
#                           key material in the OS keychain vault
#                           (`peko credential set` for manual management)
#   per-peko settings ..... the peko's own principal.toml (identity, quota,
#                           permissions, routing) — edit directly, or use
#                           `peko quota set` / `peko model` where a CLI exists
#   workspace tooling ..... plain files under the peko's workspace
#                           (roles/, skills/, mcp/, hooks/, workflows/)
#
# Only two TOML files are read by the runtime, and every block in both is
# optional (missing file = built-in defaults):

# ════════════════════════════════════════════════════════════════════
# ~/.peko/peko.toml — daemon configuration
# ($PEKO_HOME/peko.toml when PEKO_HOME is set)
# ════════════════════════════════════════════════════════════════════
#
# The only block the daemon consumes today is [provider.retry] — overrides
# for the LLM transport retry defaults. Values shown are the defaults.

# [provider.retry]
# max_retries = 5              # transport-level retries for transient errors
# retry_delay_ms = 1000        # initial backoff in ms (doubles per attempt)
# retry_max_delay_ms = 30000   # cap on the exponential backoff
# retry_jitter = 0.1           # ±10% uniform spread; omit or 0 to disable
# max_attempts = 8             # total transport+engine attempts (shared budget)
#
# Constraints (validated at daemon boot; invalid values fall back to
# defaults with a warning):
#   max_retries <= max_attempts
#   retry_delay_ms > 0
#   retry_max_delay_ms >= retry_delay_ms
#   0.0 <= retry_jitter < 1.0

# ════════════════════════════════════════════════════════════════════
# ~/.peko/config.toml — session compaction tuning
# ════════════════════════════════════════════════════════════════════
#
# Read by the compaction subsystem (ADR-022). Values shown are the
# defaults; copy the block into ~/.peko/config.toml to change them.

# [compaction]
# enabled = true
# auto_threshold_percent = 85       # trigger at 85% of model context limit
# reserve_tokens = 16384            # tokens reserved for the LLM response
# keep_recent_tokens = 20000        # minimum recent conversation preserved
# max_compactions_per_session = 100 # quota limit
# cooldown_seconds = 60             # minimum seconds between compactions

# Model context windows are not configured here: compaction reads them from
# the model catalog. Set one with `peko model add --context-window <tokens>`.
# A legacy [compaction.model_limits] block is accepted but ignored.

# ════════════════════════════════════════════════════════════════════
# Notes
# ════════════════════════════════════════════════════════════════════
#
# - The daemon's IPC/HTTP bind is a loopback constant (127.0.0.1:11435);
#   there is no bind-address knob (ADR-058 D6).
# - Logging verbosity is controlled by the RUST_LOG environment variable,
#   not a config key.
# - There are no [agent], [memory], [tools], [channels], [security], or
#   [debug] blocks — those belonged to retired subsystems (agent CRUD,
#   sqlite memory, workspace tools, chat-platform adapters).
#   Unknown keys are ignored, so old config files keep parsing.
# - Tool grants and remote registry settings are retired (ADR-066).
#   Legacy principal.toml [capabilities].grants is ignored, warns once,
#   and is omitted when saved. Peer [[permissions]] remains authoritative.
