name: Build and Release

# A release is a version bump merged to master (ADR-102 D3).
#
#   python3 scripts/bump_version.py patch   # then a pull request, merged
#
# When peko-rs/core/Cargo.toml changes on master and the tree's version has
# no published release, this workflow tags v<version> at that commit, builds
# the five archives from the tag, publishes the release and runs the smoke
# job. A merge that leaves the version alone releases nothing.
#
# Run it by hand ("Run workflow" on master) to release the tree's version when
# nothing triggered it: the first release of a version line, or a retry after
# a failed run. A tag pushed by hand also builds; it must be v<version>, or
# v<version>-<pre> for a prerelease.

on:
  push:
    branches:
      - master
    paths:
      - 'peko-rs/core/Cargo.toml'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decide whether there is something to release, and make sure its tag exists.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/bump_version.py --check
          TREE="$(python3 scripts/bump_version.py --print)"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            case "$TAG" in
              "v$TREE"|"v$TREE"-*) ;;
              *)
                echo "::error::Tag $TAG does not match the version in the tree ($TREE). Bump the version first: python3 scripts/bump_version.py (ADR-102)."
                exit 1 ;;
            esac
          elif [ "$GITHUB_REF" = "refs/heads/master" ]; then
            TAG="v$TREE"
          else
            echo "::error::Releases are cut from master or from a tag, not from $GITHUB_REF."
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag left by a failed run is reused, so a retry builds the same commit.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "Tagged $GITHUB_SHA as $TAG"
          fi

          case "$TAG" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          {
            echo "release=true"
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  # Build for Linux x86_64
  build-linux-x86_64:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      # Read at compile time by the CLI, so a prerelease tag's binaries name
      # it (`0.1.3-rc.1`); for a plain release it equals the crate version.
      PEKO_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p peko-cli -p peko-daemon

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/peko-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-gnu/release peko peko-daemon
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-linux-x86_64
          path: dist/peko-linux-x86_64.tar.gz

  # Build for Linux aarch64 (ARM64)
  build-linux-aarch64:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      # Read at compile time by the CLI, so a prerelease tag's binaries name
      # it (`0.1.3-rc.1`); for a plain release it equals the crate version.
      PEKO_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    # Native arm64 runner: cross-compiling from x86_64 fails in
    # openssl-sys (reqwest's native-tls needs the target's OpenSSL).
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release --target aarch64-unknown-linux-gnu -p peko-cli -p peko-daemon

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/peko-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-gnu/release peko peko-daemon
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-linux-aarch64
          path: dist/peko-linux-aarch64.tar.gz

  # Build for macOS x86_64
  build-macos-x86_64:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      # Read at compile time by the CLI, so a prerelease tag's binaries name
      # it (`0.1.3-rc.1`); for a plain release it equals the crate version.
      PEKO_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release --target x86_64-apple-darwin -p peko-cli -p peko-daemon

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/peko-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release peko peko-daemon
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-macos-x86_64
          path: dist/peko-macos-x86_64.tar.gz

  # Build for macOS aarch64 (Apple Silicon)
  build-macos-aarch64:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      # Read at compile time by the CLI, so a prerelease tag's binaries name
      # it (`0.1.3-rc.1`); for a plain release it equals the crate version.
      PEKO_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin -p peko-cli -p peko-daemon

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/peko-macos-aarch64.tar.gz -C target/aarch64-apple-darwin/release peko peko-daemon
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-macos-aarch64
          path: dist/peko-macos-aarch64.tar.gz

  # Build for Windows x86_64 (also runs on Windows 11 on Arm, emulated)
  build-windows-x86_64:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      # Read at compile time by the CLI, so a prerelease tag's binaries name
      # it (`0.1.3-rc.1`); for a plain release it equals the crate version.
      PEKO_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: windows-latest
    # Windows is in MVP scope (docs/MVP_GATE.md gate 0): no release
    # publishes without the zip.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # actions/cache doesn't expand `~/.cargo/...` on Windows runners.
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-release

      - name: Build release binary
        # Static CRT: the binaries don't need the Visual C++ runtime DLLs,
        # which a clean Windows install may not have.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-pc-windows-msvc -p peko-cli -p peko-daemon

      - name: Create archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = 'target/x86_64-pc-windows-msvc/release'
          Compress-Archive -Path "$bin/peko.exe", "$bin/peko-daemon.exe" -DestinationPath dist/peko-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-windows-x86_64
          path: dist/peko-windows-x86_64.zip

  # Create GitHub Release
  create-release:
    needs: [prepare, build-linux-x86_64, build-linux-aarch64, build-macos-x86_64, build-macos-aarch64, build-windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: peko-*
          merge-multiple: true
      
      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          cat > RELEASE_NOTES.md << EOF
          ## Peko v${VERSION}
          
          ### Installation
          
          \`\`\`bash
          # One-line installer, for this release
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash -s -- --version ${VERSION}
          
          # Or manually download for your platform:
          # Linux x86_64: peko-linux-x86_64.tar.gz
          # Linux ARM64:  peko-linux-aarch64.tar.gz
          # macOS x86_64: peko-macos-x86_64.tar.gz
          # macOS ARM64:  peko-macos-aarch64.tar.gz
          # Windows:      peko-windows-x86_64.zip
          \`\`\`

          On Windows (PowerShell):

          \`\`\`powershell
          & ([scriptblock]::Create((irm https://raw.githubusercontent.com/${{ github.repository }}/master/install.ps1))) -Version ${VERSION}
          \`\`\`
          
          ### Quick Start
          
          \`\`\`bash
          # Add a model to the catalog and store its API key in the vault
          # (--api-format: anthropic_messages | openai_completions | openai_responses)
          peko model add --id my-model --api-format <format> --base-url <endpoint-url> --model <wire-model-id> --key "<your-api-key>"
          
          # Start the daemon, create a peko, talk to it
          peko daemon start
          peko create my-peko --model my-model
          peko send my-peko "Hello"
          peko log my-peko
          \`\`\`
          
          ### Assets

          Each archive contains both binaries: \`peko\` (CLI) and \`peko-daemon\`
          (long-running daemon). The CLI's \`daemon start\` path resolves
          \`peko-daemon\` next to itself and prefers it over re-exec'ing
          the CLI binary.

          | Platform | Architecture | Asset |
          |----------|--------------|-------|
          | Linux    | x86_64       | peko-linux-x86_64.tar.gz |
          | Linux    | ARM64        | peko-linux-aarch64.tar.gz |
          | macOS    | x86_64       | peko-macos-x86_64.tar.gz |
          | macOS    | ARM64        | peko-macos-aarch64.tar.gz |
          | Windows  | x86_64       | peko-windows-x86_64.zip |
          
          ### Checksums
          EOF
          
          for file in artifacts/*.tar.gz artifacts/*.zip; do
            echo "\`$(basename $file)\`: \`$(sha256sum $file | cut -d' ' -f1)\`" >> RELEASE_NOTES.md
          done
          
          cat RELEASE_NOTES.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Peko v${{ steps.release_notes.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Install each published archive with install.sh and run the quick start
  # on all five platforms (release-smoke.yml).
  smoke:
    needs: [prepare, create-release]
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}
