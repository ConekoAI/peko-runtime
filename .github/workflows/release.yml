name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        default: '0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build for Linux x86_64
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p peko-cli -p peko-daemon

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/peko-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-gnu/release peko peko-daemon
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-linux-x86_64
          path: dist/peko-linux-x86_64.tar.gz

  # Build for Linux aarch64 (ARM64)
  build-linux-aarch64:
    # Native arm64 runner: cross-compiling from x86_64 fails in
    # openssl-sys (reqwest's native-tls needs the target's OpenSSL).
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release --target aarch64-unknown-linux-gnu -p peko-cli -p peko-daemon

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/peko-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-gnu/release peko peko-daemon
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-linux-aarch64
          path: dist/peko-linux-aarch64.tar.gz

  # Build for macOS x86_64
  build-macos-x86_64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release --target x86_64-apple-darwin -p peko-cli -p peko-daemon

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/peko-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release peko peko-daemon
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-macos-x86_64
          path: dist/peko-macos-x86_64.tar.gz

  # Build for macOS aarch64 (Apple Silicon)
  build-macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin -p peko-cli -p peko-daemon

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/peko-macos-aarch64.tar.gz -C target/aarch64-apple-darwin/release peko peko-daemon
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-macos-aarch64
          path: dist/peko-macos-aarch64.tar.gz

  # Build for Windows x86_64 (also runs on Windows 11 on Arm, emulated)
  build-windows-x86_64:
    runs-on: windows-latest
    # Windows is outside MVP scope (docs/MVP_GATE.md gate 0): a failure here
    # must not hold up the release, which then ships without the zip.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # actions/cache doesn't expand `~/.cargo/...` on Windows runners.
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-release

      - name: Build release binary
        # Static CRT: the binaries don't need the Visual C++ runtime DLLs,
        # which a clean Windows install may not have.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-pc-windows-msvc -p peko-cli -p peko-daemon

      - name: Create archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = 'target/x86_64-pc-windows-msvc/release'
          Compress-Archive -Path "$bin/peko.exe", "$bin/peko-daemon.exe" -DestinationPath dist/peko-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: peko-windows-x86_64
          path: dist/peko-windows-x86_64.zip

  # Create GitHub Release
  create-release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-x86_64, build-macos-aarch64, build-windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: peko-*
          merge-multiple: true
      
      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present for consistency
          VERSION=${VERSION#v}
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          cat > RELEASE_NOTES.md << EOF
          ## Peko v${VERSION}
          
          ### Installation
          
          \`\`\`bash
          # One-line installer
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash
          
          # Or manually download for your platform:
          # Linux x86_64: peko-linux-x86_64.tar.gz
          # Linux ARM64:  peko-linux-aarch64.tar.gz
          # macOS x86_64: peko-macos-x86_64.tar.gz
          # macOS ARM64:  peko-macos-aarch64.tar.gz
          # Windows:      peko-windows-x86_64.zip
          \`\`\`

          On Windows (PowerShell):

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/master/install.ps1 | iex
          \`\`\`
          
          ### Quick Start
          
          \`\`\`bash
          # Add a model to the catalog and store its API key in the vault
          # (--api-format: anthropic_messages | openai_completions | openai_responses)
          peko model add --id my-model --api-format <format> --base-url <endpoint-url> --model <wire-model-id> --key "<your-api-key>"
          
          # Start the daemon, create a peko, talk to it
          peko daemon start
          peko create my-peko --model my-model
          peko send my-peko "Hello"
          peko log my-peko
          \`\`\`
          
          ### Assets

          Each archive contains both binaries: `peko` (CLI) and `peko-daemon`
          (long-running daemon). The CLI's `daemon start` path resolves
          `peko-daemon` next to itself and prefers it over re-exec'ing
          the CLI binary.

          | Platform | Architecture | Asset |
          |----------|--------------|-------|
          | Linux    | x86_64       | peko-linux-x86_64.tar.gz |
          | Linux    | ARM64        | peko-linux-aarch64.tar.gz |
          | macOS    | x86_64       | peko-macos-x86_64.tar.gz |
          | macOS    | ARM64        | peko-macos-aarch64.tar.gz |
          | Windows  | x86_64       | peko-windows-x86_64.zip |
          
          ### Checksums
          EOF
          
          for file in artifacts/*.tar.gz artifacts/*.zip; do
            echo "\`$(basename $file)\`: \`$(sha256sum $file | cut -d' ' -f1)\`" >> RELEASE_NOTES.md
          done
          
          cat RELEASE_NOTES.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Peko v${{ steps.release_notes.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Install each published archive with install.sh and run the quick start
  # on all four platforms (release-smoke.yml).
  smoke:
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ github.ref_name }}

  # Manual release (for workflow_dispatch)
  create-manual-release:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-x86_64, build-macos-aarch64, build-windows-x86_64]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: peko-*
          merge-multiple: true
      
      - name: Create manual release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Peko v${{ github.event.inputs.version }}
          body: |
            ## Peko v${{ github.event.inputs.version }}
            
            Manual release triggered via workflow dispatch.
            
            ### Installation
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash
            ```

            On Windows (PowerShell):
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/master/install.ps1 | iex
            ```
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
