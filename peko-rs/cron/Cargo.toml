[package]
name = "peko-cron"
version = "0.1.0"
edition = "2021"
authors = ["Peko <peko@coneko.ai>"]
description = "Cron scheduler + idle detection + event-trigger engine (Phase 14.b). Pure domain with no runtime deps on session/agent/daemon; the daemon-side `CronRuntime` impl (`DaemonCronAdapter`) lives in the root binary and depends on `DaemonClient`."
license = "MIT"
repository = "https://github.com/ConekoAI/peko-runtime"

[dependencies]
# Phase 0.Z-E (2026-07-25): cron domain now lives entirely in this crate.
# Previously the cron DTOs + `CronRuntime` port + 3 tool impls were
# `peko-tools-builtin::cron` (Phase 10b), re-exported through here. They
# moved to `peko-rs/cron/src/tools/` and the sat was deleted.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.35", features = ["fs", "io-util", "macros", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Schedule parsing/next-time evaluation in `CronScheduler`.
cron = "0.12"
tracing = "0.1"
# The cron tool impls (CronCreateTool / CronDeleteTool / CronListTool)
# implement the `Tool` trait from `peko_tools_core`.
peko-tools-core = { path = "../tools-core" }
async-trait = "0.1"
# Tools generate CronJob ids + support timezone-aware schedules.
uuid = { version = "1.7", features = ["v4"] }
chrono-tz = "0.10"
# Phase B: CronJob keyed by PrincipalId (DID) instead of principal name
# string. Subject crate is the canonical home of `PrincipalId`.
peko-subject = { path = "../subject" }

[dev-dependencies]
tempfile = "3.10"
uuid = { version = "1.7", features = ["v4"] }
