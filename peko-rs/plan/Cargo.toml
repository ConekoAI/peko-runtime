[package]
name = "peko-plan"
version = "0.1.0"
edition = "2021"
authors = ["Peko <peko@peko.ai>"]
description = "Plan DAG primitive for the principal harness — durable, principal-scoped, multi-step plans stored as JSONL-on-disk with FileLock-coordinated atomic writes. Pairs with the engine's plan tool handler in a follow-on PR; v1 is schema + storage only."
license = "MIT"
repository = "https://github.com/ConekoAI/peko-runtime"

[dependencies]
peko-fs-persistence = { path = "../fs-persistence" }
peko-subject = { path = "../subject" }

async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
tracing = "0.1"
tokio = { version = "1.35", features = ["fs", "io-util", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
tempfile = "3.10"
