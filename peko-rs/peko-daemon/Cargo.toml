[package]
name = "peko-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Peko <peko@coneko.ai>"]
description = "Peko long-running background daemon binary (Phase 12 — extracted from root `peko` crate). Depends only on the root `peko` lib for the `Daemon`/`DaemonConfig`/`LaunchMode` entry surface; no daemon internals are reachable from this crate."
license = "MIT"
repository = "https://github.com/ConekoAI/peko-runtime"

[[bin]]
name = "peko-daemon"
path = "src/main.rs"

[dependencies]
# Phase 12: the `peko-daemon` binary depends on the root lib for
# the daemon entry surface (`Daemon`, `DaemonConfig`, `LaunchMode`).
# Phase 0.Z-A: root lib was renamed `peko` → `peko_core` (only
# `[lib].name` flipped; `[package].name` and `[[bin]].name` stay
# `peko`). The lib's daemon internals (`background_runtime`,
# `cron_engine`, `state`, `DaemonStatus`) stay `pub(crate)` — only
# the entry surface is reachable.
# Phase 0.Z-D: root moved to peko-rs/core/. `package = "peko"` is still
# required because Cargo matches dep names to `[lib].name` by default.
peko_core = { package = "peko", path = "../core" }
anyhow = "1.0"
tokio = { version = "1.35", features = ["full", "net", "macros", "rt-multi-thread"] }
