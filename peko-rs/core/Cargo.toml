[package]
name = "peko"
version = "0.1.0"
edition = "2021"
authors = ["Peko <peko@coneko.ai>"]
description = "Lightweight multi-agent runtime with optional Coneko network"
license = "MIT"
repository = "https://github.com/ConekoAI/peko-runtime"

# Phase 0.Z-A: lib name diverged from `package.name` so the workspace
# root lib matches the codex convention `peko_core` (mirrors
# codex-rs/core → `codex_core`). The on-disk CLI binary stays named
# `peko`. External consumers continue to write `use peko::...` (which
# resolves to the package) until a deliberate external-API release
# flips `[package].name = "peko_core"`.
#
# Phase 0.Z-D: this crate moved from repo-root `src/` to
# `peko-rs/core/src/`. The `package = "peko"` rename trick still
# applies for satellites that depend on us (e.g. `peko-rs/peko-daemon`
# declares `peko_core = { package = "peko", path = "../core" }`).
#
# Phase 0.Z-B: this crate is now a pure lib (no `[[bin]]`). The
# `peko` binary lives in `peko-rs/cli/Cargo.toml` which depends on
# this crate via `peko_core = { package = "peko", path = "../core" }`.
# The CLI composition surface (`Cli`/`Commands`/`GlobalPaths`/
# `init_logging`) is consumed directly from the cli sat — no re-export
# needed here.
[lib]
name = "peko_core"
path = "src/lib.rs"

[dependencies]
# Workspace member providing the agentic engine. Phase 9a extracted
# the pure-dependency files (chunker, event_processor, state,
# stream_buffer, stream_orchestrator, tool_stream, parallel_gate,
# error, events re-export). The remaining root-coupled files
# (agentic_loop, compaction_driver, tool_executor, tool_runtime,
# async_completion, stream_types) stay in src/engine/ until Phase 9b
# lifts the agent / session / tools couplings.
peko-engine = { path = "../engine" }
# Workspace member providing the neutral message contract
# (`ContentBlock`, `LlmMessage`, `MessageRole`, `TokenUsage`, …). The
# root re-exports it through `common::types::message` so existing
# `peko::common::types::message::...` and `peko::providers::...` paths
# keep working unchanged.
peko-message = { path = "../message" }
# Workspace member providing the canonical actor type (`Subject`,
# `SubjectKind`, `PrincipalId`, `PrincipalDID`, `SubjectParseError`,
# `subject_from_string_with_default_user`). Pure value/type layer
# with no inbound edge from principal, agents, engine, daemon,
# providers, or extensions. The root re-exports it through
# `crate::subject` and `crate::auth` for backwards compatibility.
peko-subject = { path = "../subject" }
# Workspace member providing per-principal token quota (F18). Owns
# QuotaMeter, QuotaScope, QuotaState, QuotaConfig, QuotaError as one
# coherent domain. Depends on peko-message for TokenUsage; the root
# re-exports it through `crate::quota` for backwards compatibility.
peko-quota = { path = "../quota" }
# Workspace member providing the tool execution API (Tool trait,
# ToolContext, AbortSignal, ToolResult, ToolError, ToolInterruptNotice,
# ContextSource, ToolExposure — F34). The extension framework, the
# built-in tools, and the agentic loop all import from this crate;
# it depends on nothing except serde/anyhow/tokio. The root
# re-exports it through `crate::tools::core` for backwards
# compatibility.
peko-tools-core = { path = "../tools-core" }
# Built-in tool implementations live in `src/tools/builtin/` after
# Phase F4 (2026-07-25) lifted them from `peko-tools-builtin`.
# Phase 0.Z-E deleted that sat; cron + tool_search_metadata moved to
# `peko-cron` + `peko-engine` respectively.
# Workspace member providing the provider contract types
# (ChatOptions, ChatResponse, StreamEvent, ContentDelta, StopReason,
# BlockType, ToolDefinition, ContentBlockId, ThinkingEffort,
# ThinkingFormat, ThinkingKeep, ToolChoice, ServiceTier,
# ProviderCompat, DeferredToolsMode, CacheRetention). The
# concrete `Provider` impl, HTTP transport, adapters, and resolver
# moved into `peko-providers` in Phase 6; this crate now owns only
# the contract types. Depends on peko-message only; the root
# re-exports through `crate::providers::traits::*` (a transitional
# shim) for backwards compatibility — the shim is deleted in
# Phase 15.
peko-provider-api = { path = "../provider-api" }
# Workspace member providing the concrete LLM provider
# implementations (Phase 6) — owns the unified Provider core,
# HTTP transport, per-adapter request builders (OpenAI Chat
# Completions / OpenAI Responses / Anthropic Messages /
# OpenAI-compatible), the model catalog, templates, mock adapter,
# metered wrapper, validator, LlmResolver, RotationState, and the
# read-side `SecretStore` trait with `InMemorySecretStore` impl.
# Replaces root `src/providers/`; the historical
# `crate::providers::*` paths are intentionally broken.
peko-providers = { path = "../providers" }
# Workspace member providing the extension framework API contracts
# (Phase 7) — owns ExtensionId, HookId, HookInput/Output/Result,
# ExtensionManifest, Capability, Capabilities, ActiveExtensionSet,
# ToolMetadata, ToolSource, ToolRuntimeContext, AsyncReceipt,
# AsyncTaskStatus, MessageEnvelope, SessionSnapshot, PromptBuildState,
# ToolRegistryAccess, and the data parts of ReservedParamsConfig /
# ParamSource. The concrete framework host (registry, async executor,
# transport, store, manager, scaffold) stays in the root package —
# Phase 8 will move that into `peko-extension-host`. Depends on
# peko-message, peko-tools-core, peko-provider-api; the root
# re-exports through `peko_extension_host::types::*` for
# backwards compatibility.
peko-extension-api = { path = "../extension-api" }
# Phase F2 (foldback): the extension framework host (ExtensionCore,
# hook dispatch, capability gate, async executor, transport, manager/store,
# scaffold, skill catalog, integration, framework services, and the
# SimpleRegistry/SharedRegistry utilities) was folded back into
# `peko-rs/core/src/extensions/framework/` and the `peko-extension-host`
# crate deleted. Callers now import from `crate::extensions::framework::*`.
# Workspace member providing the IPC + tunnel wire-shape contracts
# (Phase 11a) — owns the auth envelope (`AuthCredential`,
# `AuthHeader`) and the shared packet/timeout
# constants. The bulk of the wire protocol (`RequestPacket`,
# `ResponsePacket`, `TunnelMessage`, instance payloads) stays in root
# until the wider Phase 11 boundary lifts them.
peko-protocol = { path = "../protocol" }
# Workspace member providing the DID identity + key storage + runtime
# identity domain (Phase 3) — owns Identity / DIDDocument / KeyPair /
# KeyStorage / KeychainStorage / EncryptedKeyStorage /
# RuntimeIdentity / RuntimeMetadata / DidResolver / public_key_to_did_key.
# Depends only on peko-subject; root implements the
# `RuntimePaths` / `IdentityVault` / `IdentityDataDir` trait ports
# defined in `peko-identity::host` so peko-identity stays a leaf crate.
# The root re-exports are removed entirely in Phase 15.
peko-identity = { path = "../identity" }
# Workspace member providing authentication/authorization (Phase 4 of
# the post-migration cleanup). Owns the canonical auth domain:
# ApiKey/ApiKeyStore, CallerContext, JwtValidator, RateLimiter,
# Permission, Resource, Action, AuthError, plus the `Exposure` enum
# lifted from principal/config. Depends only on `peko-subject`; root
# implements the `RuntimePaths` / `PrincipalResourceView` trait ports
# defined in `peko-auth::host` so `peko-auth` stays a leaf crate.
peko-auth = { path = "../auth" }
# Phase 14 of the post-migration cleanup — observability hub
# (audit log + metrics + tracing). Depends only on `peko-auth` for
# `Subject` caller attribution (ADR-039, issues #17 + #26). The 4
# root files (`src/observability/{mod,audit,metrics,tracer}.rs`)
# are deleted when the 8 callers migrate to `peko_observability::*`.
peko-observability = { path = "../observability" }
# Workspace member providing the Plan DAG primitive (Phase 12+).
# Owns the schema, file-backed storage, and `PlanPort` trait. Depends
# only on peko-fs-persistence + peko-subject; the `Principal` struct
# holds `plan_port: Arc<dyn peko_plan::PlanPort>` so the engine loop
# (via the future plan tool handler #2 PR) can call into plan storage
# without naming the concrete `PlanStorage`.
peko-plan = { path = "../plan" }
# Phase 14.b — peko-cron owns the cron scheduler + idle detection +
# event-trigger engine. Depends only on `peko-tools-builtin` for the
# canonical cron DTO re-exports (Phase 10b). The daemon-side
# `DaemonCronAdapter` impl of the `CronRuntime` port trait stays in
# root (`src/daemon/cron_runtime.rs`) because it depends on root-only
# `crate::ipc::{DaemonClient, ResponsePacket}`. The 4 lifted files
# (`src/cron/{mod,events,idle,event_trigger}.rs`, 1,301 lines) become
# `peko-rs/cron/src/{lib,events,idle,event_trigger}.rs`.
peko-cron = { path = "../cron" }
# Phase F3 (foldback): peko-principal sat is deleted; the 11 pure-deps
# files (config, peer, memory, agent_prompt, capability_evaluator,
# extension_store, runtime::*) all live in
# `peko-rs/core/src/principal/` directly now. The runtime-coupled
# subset (manager, context, agent_runner, routers) continues to live
# alongside the `Principal` struct. (`slash::extension_row` was part
# of this lift; retired post-slash-removal.)
# Phase 7 — peko-session owns the session persistence domain
# (JSONL storage, metadata, recovery, compaction persistence,
# InboxRegistry). Root re-exports the historical `crate::session::*`
# paths via the legacy `src/session/` shim until Phase 7.4 deletes
# the directory. After 7.4, root-side callers will import from
# `peko_session::*` directly. The crate is downstream of
# peko-extension-api / peko-providers / peko-fs-persistence / etc.
# (see peko-rs/session/Cargo.toml).
peko-session = { path = "../session" }
peko-channel = { path = "../channel" }
# Async runtime
# `full` enables `net`, but listing `net` explicitly documents the
# dependency on `tokio::net::windows::named_pipe` (ADR-038).
tokio = { version = "1.35", features = ["full", "net"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# HTTP client (used by registry, MCP transport, providers, message tool)
reqwest = { version = "0.11", features = ["json", "stream"] }

# Crypto (ed25519)
ed25519-dalek = "2.1"
rand = "0.8"
base64 = "0.22"
blake3 = "1.5"
bs58 = "0.5"
sha2 = "0.10"

# Filesystem walking for the principal-config drift detector
# (ADR-046): walks `{config_dir}/principals/*/principal.toml` at
# daemon startup to hash each principal's shared-tier config and
# compare against the previous-boot baseline.
walkdir = "2"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
scopeguard = "1.2"

# Async traits
async-trait = "0.1"
futures = "0.3"

# System calls (for daemon process management)
libc = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"

# UUID
uuid = { version = "1.7", features = ["v4", "v5", "serde"] }

# Directories
dirs = "5.0"

# URL encoding
url = "2.5"
urlencoding = "2.1"

# Built-in tool deps (Phase F4 lift from peko-tools-builtin):
# Glob pattern matching for `glob` tool's `Pattern` API.
glob = "0.3"
# Regular expression engine for the `grep` tool.
regex = "1.10"
# Timezone resolution in `session/tool.rs` (cron DTOs use it via the sat).
chrono-tz = "0.10"

# Binary discovery
which = "6.0"

# Portable agent dependencies
tar = "0.4"
flate2 = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
hex = "0.4"

# Secret manager dependencies
keyring = "2.3"
secrecy = { version = "0.10", features = ["serde"] }

# WebSocket tunnel (ADR-035)
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustls = "0.22"
rustls-pemfile = "1"
tokio-rustls = "0.25"
webpki-roots = "0.26"

# Windows system calls
# `Win32_System_Pipes`           : CreateNamedPipeW (ADR-038, named-pipe transport)
# `Win32_Security`               : SECURITY_DESCRIPTOR, SECURITY_ATTRIBUTES
# `Win32_Security_Authorization` : ConvertStringSecurityDescriptorToSecurityDescriptorW
# `Win32_Foundation`             : CloseHandle, GetLastError, LocalFree (already present)
# `Win32_System_Threading`, `Win32_System_JobObjects` : Job Objects (src/common/process/job_object.rs)
# `Win32_System_Pipes`           : CreateNamedPipeW (src/ipc/server.rs)
#   ...which also requires `Win32_Storage_FileSystem` (FILE_FLAGS_AND_ATTRIBUTES
#   is its `dwopenmode` parameter, see windows-sys 0.52 src/Windows/Win32/System/Pipes/mod.rs).
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

# JWT validation
jsonwebtoken = "9"
# JSON Schema validation for tool arg validation (F32b). Lifted from
# `peko-extension-host` Cargo.toml in Phase F2 foldback.
jsonschema = { version = "0.48", default-features = false }

[features]
# `test-utils` is intentionally NOT in `default`: it exposes resolver/hub-directory
# test hooks that must not ship in the production binary. Tests that need
# internal access opt in explicitly, e.g.
#   cargo test --lib --features test-utils daemon::e2e_tests
default = []
# Expose internal modules for integration tests. No specific call-site
# modules are gated on `test-utils` after PR-E #5 deleted
# `framework::core::test_sync` (the only such gating); the feature is
# kept for future opt-in test seams.
test-utils = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
serial_test = "3.0"
rsa = "0.9"


# Integration tests under tests/scenarios/ are nested in a subdir
# (cargo's auto-discovery only picks up tests/*.rs directly). Each
# scenario file needs an explicit [[test]] entry — D1 lands first,
# D2-D4 add their own entries in their respective PRs.
#
# Phase 5 (ADR-047 §2.1): the `s1_local_agent_with_extensions` and
# `s2_extension_registry_roundtrip` scenarios were retired — they
# exercise the deleted `peko ext` CLI and on-disk extension store.

[[test]]
name = "s4_publish_running_agent_with_permission"
path = "tests/scenarios/s4_publish_running_agent_with_permission.rs"

[[test]]
name = "s6_principal_grant_revoke_roundtrip"
path = "tests/scenarios/s6_principal_grant_revoke_roundtrip.rs"

[[test]]
name = "tunnel_security"
path = "tests/tunnel_security.rs"

# Core tool parity harness for the Claude Code built-in tool surface.
[[test]]
name = "core_tools"
path = "tests/core_tools.rs"